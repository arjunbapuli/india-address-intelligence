# Fly.io alternative: `fly launch --no-deploy`, `fly postgres create`, `fly postgres attach`, `fly deploy`.
app = "india-address-intelligence"
primary_region = "bom"   # Mumbai

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[env]
  ENVIRONMENT = "production"
  WEB_CONCURRENCY = "1"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
