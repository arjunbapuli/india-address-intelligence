[project]
name = "india-address-intelligence"
version = "0.1.0"
description = "Address intelligence API for Indian addresses: normalization, extraction, PIN validation, fuzzy/phonetic matching, ranking and evidence-based confidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.9",
    "jellyfish>=1.0",
    "indic-transliteration>=2.3",
    "httpx>=0.27",
    # Packaged copy of India Post's All-India Pincode Directory (MIT-licensed wrapper,
    # underlying data from India Post / data.gov.in). Pinned so ingestion is reproducible.
    "indiapins==1.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
osm = ["osmium>=3.7"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "osmium>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["slow: tests that load the full India-wide gazetteer"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
