# Render Blueprint: one web service (Docker) + one Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Memory: the API uses ~340 MB with the full India Post gazetteer loaded, so the
# "starter" plan (512 MB) works. Importing large OpenStreetMap extracts needs more
# (use "standard"). See docs/deployment.md for costs.
databases:
  - name: address-intel-db
    plan: basic-256mb
    databaseName: address_intel
    user: address

services:
  - type: web
    name: india-address-intelligence
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: address-intel-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: API_KEYS
        generateValue: true
      - key: STORE_ADDRESS_TEXT
        value: "false"
      - key: DATA_RETENTION_DAYS
        value: "30"
      - key: WEB_CONCURRENCY
        value: "1"
